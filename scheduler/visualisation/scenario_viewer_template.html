<title>Scenario Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: scenario list on the left, one scenario on the right. Each day is a card of aligned time lanes:
   one lane per member, then the answer key, then one lane per arm, so a booked time can be read straight down. */
:root {
  --bg: #F3F5F8; --panel: #FFFFFF; --ink: #18212E; --muted: #566274; --line: #D6DDE6; --line-soft: #E8ECF1;
  --accent: #2B5C8F; --accent-soft: #E3ECF6;
  --busy: #5E6E84; --busy-ink: #FFFFFF; --mov-bg: #E1E6EE; --soft: #8F7BC8; --off: #EDF0F4; --canary: #B8731B;
  --good: #2E8A57; --good-soft: #D8EEE2; --warn: #C98A12; --warn-soft: #F6E8C6; --bad: #C2412F; --bad-soft: #F7DAD4;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --lw: 150px; --text: var(--ink);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F151D; --panel: #171F2A; --ink: #E6EBF2; --muted: #9AA6B8; --line: #2B3645; --line-soft: #222C39;
  --accent: #7DB0E8; --accent-soft: #1D2D42;
  --busy: #8497B2; --busy-ink: #0F151D; --mov-bg: #2A3544; --soft: #A798DB; --off: #1B2430; --canary: #E3A252;
  --good: #4DB383; --good-soft: #1D3A2D; --warn: #E0AC3C; --warn-soft: #3D3217; --bad: #E27766; --bad-soft: #43211C;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F151D; --panel: #171F2A; --ink: #E6EBF2; --muted: #9AA6B8; --line: #2B3645; --line-soft: #222C39;
  --accent: #7DB0E8; --accent-soft: #1D2D42;
  --busy: #8497B2; --busy-ink: #0F151D; --mov-bg: #2A3544; --soft: #A798DB; --off: #1B2430; --canary: #E3A252;
  --good: #4DB383; --good-soft: #1D3A2D; --warn: #E0AC3C; --warn-soft: #3D3217; --bad: #E27766; --bad-soft: #43211C;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.app { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 20px; align-items: start; }
.side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.side summary { list-style: none; padding: 12px 14px; font-weight: 700; cursor: pointer; display: none; }
.side summary::-webkit-details-marker { display: none; }
.filters { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.filters select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.filters label.chk { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.count { color: var(--muted); font-size: 12px; }
.list { display: grid; }
.item { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-soft); padding: 10px 14px; display: grid; gap: 4px; }
.item:hover { background: var(--accent-soft); }
.item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item .id { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.item .tx { font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dots { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.dot { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.dot i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
.dot.pass i { background: var(--good); border-color: var(--good); }
.dot.warn i { background: var(--warn); border-color: var(--warn); }
.dot.bad i { background: var(--bad); border-color: var(--bad); }
.dot.rp-ok i { border-color: var(--good); border-style: dashed; }
.dot.rp-bad i { border-color: var(--bad); border-style: dashed; }
.dot.none { opacity: .55; }

.main { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.crumb { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.badge.final { background: var(--warn-soft); color: var(--warn); }
h1 { font-size: 1.45rem; line-height: 1.25; text-wrap: balance; margin: 6px 0 4px; }
.meta { color: var(--muted); font-size: 13.5px; }
h2 { font-size: 1rem; margin-bottom: 8px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.tests { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.tests li { font-size: 14px; }
.tests b { font-weight: 700; }
.answer { font-size: 15px; }
.answer .big { font-weight: 700; font-size: 1.15rem; display: block; margin-bottom: 4px; }
.must { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.must span { font-size: 12.5px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--bg); }
.script { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); display: grid; gap: 3px; }

.arms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.arm { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.arm h3 { font-size: 14px; display: flex; gap: 6px; align-items: baseline; }
.arm h3 .l { font-family: var(--mono); color: var(--accent); }
.arm .pl { font-size: 12.5px; color: var(--muted); }
.arm .sum { font-size: 13px; font-weight: 700; }
.chips { display: grid; gap: 4px; }
.chip { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; border-left-width: 4px; }
.chip:hover { background: var(--accent-soft); }
.chip[aria-pressed="true"] { outline: 2px solid var(--accent); }
.chip .t { font-family: var(--mono); font-size: 12px; }
.chip .v { color: var(--muted); font-size: 12px; }
.chip.pass { border-left-color: var(--good); } .chip.warn { border-left-color: var(--warn); }
.chip.bad { border-left-color: var(--bad); } .chip.rp-ok { border-left-color: var(--good); border-left-style: dashed; }
.chip.rp-bad { border-left-color: var(--bad); border-left-style: dashed; } .chip.rp-sub { border-left-color: var(--warn); border-left-style: dashed; }
.chip.nohit { cursor: default; }

/* conversation replay */
.why { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 12.5px; }
.why li { padding: 3px 8px; border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 0 6px 6px 0; overflow-wrap: anywhere; }
.why li b { font-weight: 700; }
.why li.okline { border-left-color: var(--good); background: var(--good-soft); }
.chk { margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.chk summary { cursor: pointer; font-weight: 700; font-size: 13.5px; }
.chk .grp { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 2px; }
.chk .row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; font-size: 13.5px; padding: 2px 0; }
.chk .row i { font-style: normal; font-weight: 700; text-align: center; }
.chk .row.ok i { color: var(--good); } .chk .row.no i { color: var(--bad); } .chk .row.no span { color: var(--bad); }

.cv-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; align-items: center; }
.cv-tabs .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.pill { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.pill:hover { background: var(--accent-soft); }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.pill .d { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill .d.pass { background: var(--good); } .pill .d.warn { background: var(--warn); } .pill .d.bad { background: var(--bad); }
.cv-strip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0 12px; }
.step { font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
.step.thread { border-color: var(--accent); color: var(--accent); } .step.priv { border-color: var(--warn); color: var(--warn); }
.step.sys { border-color: var(--good); color: var(--good); } .step.bad { border-color: var(--bad); color: var(--bad); }
.arrow { color: var(--muted); font-size: 12px; }
.cv-facts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.cv-facts b { color: var(--text); }
.cv-intro { font-size: 13.5px; margin: 0 0 8px; }
.conv { display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 10px; align-items: start; }
.who { font-size: 12.5px; font-weight: 700; padding-top: 7px; text-align: right; overflow-wrap: anywhere; }
.who.agent { color: var(--accent); } .who.plan { color: var(--warn); } .who.person { color: var(--text); } .who.sys { color: var(--good); }
.bub { border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 6px 10px; background: var(--bg); min-width: 0; }
.bub.thread { border-left-color: var(--accent); background: var(--accent-soft); }
.bub.priv { border-left-color: var(--warn); background: var(--warn-soft); }
.bub.int { border-left-color: var(--muted); }
.bub.sys { border-left-color: var(--good); }
.bub.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.bub .lab { font-size: 11.5px; color: var(--muted); }
.bub .body { font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 1px; }
.bub .vis { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.bub .vis b { color: var(--text); }
.hid { font-size: 12px; color: var(--muted); padding: 0 0 0 128px; }
.rd { font-size: 12px; font-weight: 700; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 4px; }
.ev.small .bub { padding: 3px 8px; } .ev.small .body { font-family: var(--mono); font-size: 12px; }
.ctx { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.ctx summary { cursor: pointer; font-size: 13.5px; font-weight: 700; }
.ctx pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; margin: 8px 0 0; max-height: 380px; overflow: auto; }
.ctx mark { background: var(--bad-soft); color: var(--bad); font-weight: 700; padding: 0 2px; border-radius: 3px; }
@media (max-width: 640px) { .ev { grid-template-columns: 1fr; gap: 2px; } .who { text-align: left; padding-top: 0; } .hid { padding-left: 0; } }

.notrun { font-size: 13px; color: var(--muted); }

.members { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.mem { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
.mem summary { padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mem summary b { font-weight: 700; }
.mem .role { font-size: 11.5px; color: var(--muted); }
.mem .body { padding: 0 10px 10px; display: grid; gap: 8px; font-size: 13px; }
.mem h4 { margin: 0; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.mem ul { margin: 2px 0 0; padding-left: 16px; display: grid; gap: 2px; }
.pvtag { font-size: 10.5px; font-weight: 700; color: var(--canary); border: 1px dotted var(--canary); border-radius: 4px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }

.dayctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.btn:hover { background: var(--accent-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 22px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid transparent; }
.sw.hard { background: var(--busy); }
.sw.mov { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--busy) 70%, transparent) 0 3px, var(--mov-bg) 3px 6px); }
.sw.soft { background: color-mix(in srgb, var(--soft) 45%, transparent); }
.sw.off { background: var(--off); border-color: var(--line); }
.sw.pv { background: var(--busy); outline: 1.5px dotted var(--canary); outline-offset: 1px; }
.sw.key { background: var(--good); opacity: .8; }
.sw.pass { background: var(--good); } .sw.warn { background: var(--warn); } .sw.bad { background: var(--bad); }
.sw.rp { background: transparent; border: 2px dashed var(--muted); }

.day { border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; overflow: hidden; }
.dayhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
.dayhead h3 { font-size: 14.5px; }
.dayhead .dsum { font-size: 12.5px; color: var(--muted); }
.scroll { overflow-x: auto; }
.grid { position: relative; min-width: 720px; }
.row { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); border-bottom: 1px solid var(--line-soft); }
.row:last-of-type { border-bottom: 0; }
.lab { position: sticky; left: 0; z-index: 6; background: var(--panel); padding: 5px 10px; font-size: 13px; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--line); min-width: 0; }
.lab b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab small { color: var(--muted); font-size: 11.5px; }
.lab.sec { background: var(--bg); }
.trk { position: relative; min-height: 30px;
  background-image: linear-gradient(to right, var(--line-soft) 1px, transparent 1px);
  background-size: calc(100% * 60 / var(--span)) 100%; background-position: calc(100% * var(--off0) / var(--span)) 0; }
.axis .trk { min-height: 22px; background: none; }
.axis .lab { background: var(--panel); }
.tick { position: absolute; top: 3px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); transform: translateX(-50%); }
.offh { position: absolute; top: 0; bottom: 0; background: var(--off); opacity: .95; }
.blk { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 10.5px; font-weight: 700; line-height: 20px; padding: 0 4px; cursor: default; }
.blk.hard { background: var(--busy); color: var(--busy-ink); z-index: 3; }
.blk.movable { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--busy) 70%, transparent) 0 3px, var(--mov-bg) 3px 6px); color: var(--ink); text-shadow: 0 0 3px var(--panel), 0 0 3px var(--panel); z-index: 2; }
.blk.soft { background: color-mix(in srgb, var(--soft) var(--sa), transparent); color: var(--ink); z-index: 1; }
.blk.pv { outline: 1.5px dotted var(--canary); outline-offset: 1px; }
.kc { position: absolute; top: 5px; bottom: 5px; background: var(--good); border-radius: 2px; }
.kc.cons { background: repeating-linear-gradient(45deg, var(--good) 0 3px, transparent 3px 6px); border: 1px solid var(--good); }
.ans { position: absolute; top: 2px; bottom: 2px; border: 2px solid var(--good); border-radius: 4px; background: var(--good-soft); z-index: 2; opacity: .9; }
.ans span { position: absolute; top: -1px; left: 4px; font-size: 10.5px; font-weight: 700; color: var(--good); line-height: 24px; }
.nokey { position: absolute; inset: 0; padding: 6px 10px; font-size: 12.5px; color: var(--muted); }
.bar { position: absolute; height: 12px; border-radius: 3px; font-size: 9.5px; font-weight: 700; line-height: 12px; padding: 0 3px; color: #fff; z-index: 4; overflow: hidden; cursor: pointer; }
.bar.pass { background: var(--good); } .bar.warn { background: var(--warn); } .bar.bad { background: var(--bad); }
.bar.rp-ok, .bar.rp-bad, .bar.rp-sub { background: transparent; border: 2px dashed; line-height: 8px; }
.bar.rp-ok { color: var(--good); border-color: var(--good); } .bar.rp-bad { color: var(--bad); border-color: var(--bad); } .bar.rp-sub { color: var(--warn); border-color: var(--warn); }
.idle { position: absolute; inset: 0; padding: 6px 10px; font-size: 12.5px; color: var(--muted); }
.overlay { position: absolute; top: 0; bottom: 0; left: var(--lw); right: 0; pointer-events: none; z-index: 5; }
.band { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 16%, transparent); border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); }
.note { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
#tip { position: fixed; z-index: 50; max-width: 320px; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
#tip b { font-weight: 700; } #tip .sub { opacity: .8; display: block; }
#tip hr { border: 0; border-top: 1px solid currentColor; opacity: .25; margin: 5px 0; }

/* ---- scenario viewer additions ---- */
.rt { min-width: 0; display: grid; gap: 14px; align-content: start; }
.viewbar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 2px 0 6px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 6px 14px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.viewnote { font-size: 12.5px; color: var(--muted); flex: 1 1 260px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-top: 12px; }
.tab { border: 0; background: none; padding: 8px 14px; font-size: 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab:hover:not([disabled]) { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab[disabled] { opacity: .45; cursor: not-allowed; }
.panel { display: grid; gap: 16px; min-width: 0; }
.filters input[type="search"] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.fam > summary { list-style: none; cursor: pointer; padding: 7px 14px; background: var(--bg); border-bottom: 1px solid var(--line-soft); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; position: sticky; top: 0; z-index: 2; }
.fam > summary::-webkit-details-marker { display: none; }
.fam > summary::before { content: "▾"; margin-right: 6px; }
.fam:not([open]) > summary::before { content: "▸"; }
.fam .n { font-family: var(--mono); font-weight: 400; }
.item .atkbadge { color: var(--bad); font-weight: 700; }
.brief p { margin: 0 0 6px; font-size: 14px; }
.brief ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.draftbadge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); margin-left: 8px; vertical-align: middle; }
.reqbox { display: grid; gap: 6px; font-size: 14px; }
.people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.people span { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.who-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }

.codes { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

.rk { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rk th { text-align: left; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 4px 8px; border-bottom: 1px solid var(--line); }
.rk td { padding: 5px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.rk tr.isans td { background: var(--good-soft); }
.rk .sc { font-family: var(--mono); white-space: nowrap; }
.rk .bar2 { display: inline-block; height: 8px; border-radius: 4px; background: var(--good); vertical-align: middle; margin-left: 6px; }

.rk .tag.a { background: var(--good); color: #fff; } .rk .tag.o { background: var(--warn-soft); color: var(--warn); } .rk .tag.n { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.whylist { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }

.ruled .rb { height: 12px; background: var(--line-soft); border-radius: 6px; overflow: hidden; display: flex; }
.ruled .rb i { display: block; height: 100%; } .ruled .rb .h { background: var(--busy); } .ruled .rb .m { background: var(--bad); opacity: .7; }
.atk-text { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.atk-text mark.inj { background: var(--bad-soft); color: var(--bad); font-weight: 700; padding: 0 2px; border-radius: 3px; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); font-size: 13px; } .kv dd { margin: 0; }
.def { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: grid; gap: 2px; background: var(--bg); }
.def .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 700; font-size: 14px; }
.def .ref { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.layer { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.layer.code { background: var(--good-soft); color: var(--good); } .layer.prompt { background: var(--warn-soft); color: var(--warn); }
.outcome { display: flex; gap: 6px; flex-wrap: wrap; }
.outcome .o { border: 1px solid var(--line); border-left-width: 4px; border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
.outcome .o.held { border-left-color: var(--good); } .outcome .o.worked { border-left-color: var(--bad); background: var(--bad-soft); font-weight: 700; }
.banner { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; color: var(--muted); background: var(--bg); }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
  .side summary { display: block; }
  .side:not([open]) .filters, .side:not([open]) .list { display: none; }
  .side .list { max-height: 55vh; overflow: auto; }
  :root { --lw: 118px; }
}
@media (prefers-reduced-motion: no-preference) { .item, .chip, .btn { transition: background-color .12s; } }
</style>

<div class="app">
  <details class="side" id="side" open>
    <summary>Choose a test case</summary>
    <div class="filters">
      <input type="search" id="fQ" placeholder="Search id, request or family" aria-label="Search scenarios">
      <select id="fSplit" aria-label="Test set">
        <option value="all">All test cases</option>
        <option value="dev">Practice set</option>
        <option value="heldout">Final exam set</option>
      </select>
      <select id="fTag" aria-label="Type of test"><option value="all">Every tag</option></select>
      <label class="chk"><input type="checkbox" id="fRes"> Only cases with saved agent runs</label>
      <div class="count" id="count"></div>
    </div>
    <div class="list" id="list"></div>
  </details>
  <div class="rt">
    <div class="viewbar">
      <div class="seg" role="group" aria-label="View as"><button id="vAgent" aria-pressed="false">Agent’s view</button><button id="vKey" aria-pressed="true">Answer key</button></div>
      <div class="viewnote" id="viewnote"></div>
    </div>
    <main class="main" id="main" aria-live="polite"></main>
  </div>
</div>
<div id="tip" hidden></div>

<script>
const DATA = __DATA__;
</script>
<script>
const S = DATA.scen, IDS = Object.keys(S).sort();
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayName = d => { const t = new Date(d + 'T00:00:00'); return DOW[t.getDay()] + ' ' + t.getDate() + ' ' + MON[t.getMonth()]; };
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const mins = t => +t.slice(11, 13) * 60 + +t.slice(14, 16);
const dOf = t => t.slice(0, 10);
const rng = (a, b) => hm(a) + '–' + hm(b);

const ARM = {
  a: { name: 'Free/busy tool', plain: "Today's calendar tool. Takes the earliest empty slot. No AI, no lookups, never asks." },
  b: { name: 'Single AI call', plain: 'The AI sees everything once and answers once. It cannot ask anyone or replan.' },
  c: { name: 'One shared assistant', plain: 'Same loop as ours, but one AI holds everyone’s private data.' },
  d: { name: 'Our design', plain: 'A private secretary per person, plus a group planner.' }
};
const TAGS = DATA.tags;
const SRC = { event: 'calendar entry', leave: 'time away', message: 'message', pref: 'what they said', memory: 'memory note', lookup: 'looked-up schedule', other: 'other' };

const state = { conv: null, sid: null, view: 'key', tab: 'brief', who: null, showAll: false, rkAll: false, pin: null, hover: null,
  split: 'all', tag: 'all', q: '', onlyRes: false, closed: new Set() };
let TIPS = [];

/* ---------- grading helpers ---------- */
function runClass(r) {
  if (r.tag === 'replay') return r.cls;
  const g = r.g;
  if (g.passed === 'True') return 'pass';
  if (g.critical !== 'True' && g.outcome_ok === 'True') return 'warn';
  return 'bad';
}
const CLS_TEXT = { pass: 'Pass', warn: 'Right answer, wrong method', bad: 'Failed', 'rp-ok': 'Matches the answer key', 'rp-bad': 'Breaks a hard limit', 'rp-sub': 'Allowed, but not the best slot' };
function prepReplay(sc) {
  const r = sc.arms.a.runs[0];
  if (sc.arms.a.kind !== 'replay') return;
  const best = sc.gt.rule === 'best' ? (r.u != null && r.u >= sc.best - 1e-9) : true;
  if (sc.outcome === 'hand_back') r.cls = r.status === 'hand_back' ? 'rp-ok' : 'rp-bad';
  else if (r.status !== 'scheduled') r.cls = 'rp-sub';
  else if (r.hard_by && r.hard_by.length) r.cls = 'rp-bad';
  else if (r.in_key && best) r.cls = 'rp-ok';
  else r.cls = 'rp-sub';
}
Object.values(S).forEach(prepReplay);
const tagLab = r => (r.tag === 'dev7' || r.tag === 'heldout-final') ? '' : ' · ' + esc(r.tag.replace('-dev', ''));
function pname(sc, id) { const l = sc.lanes.find(x => x.id === id); return l ? l.name.split(' ')[0] : id; }
function armDot(sc, arm) {
  const A = sc.arms[arm];
  if (!A) return 'none';
  if (A.kind === 'replay') return A.runs[0].cls === 'rp-ok' ? 'rp-ok' : 'rp-bad';
  const p = A.runs.filter(r => runClass(r) === 'pass').length;
  return p === A.runs.length ? 'pass' : p === 0 ? 'bad' : 'warn';
}
function runWhen(r) { return r.status === 'scheduled' && r.start ? dayName(dOf(r.start)) + ' ' + rng(mins(r.start), mins(r.end)) : (r.status === 'hand_back' ? 'handed back' : r.status); }

function runTip(sc, arm, r) {
  const rep = r.tag === 'replay';
  let h = `<b>${esc(ARM[arm].name)}</b><span class="sub">${rep ? 'Replayed here: the same rule re-run on this case (not graded by the checker)' : 'Saved run ' + r.run + ' from ' + (r.tag === 'heldout-final' ? 'the held-out sweep (28 Oct)' : esc(r.tag))}</span><hr>`;
  h += `<b>${esc(CLS_TEXT[runClass(r)])}</b><br>${esc(runWhen(r))}`;
  if (rep) {
    if (r.hard_by && r.hard_by.length) h += `<br>Clashes with a hard limit for ${r.hard_by.map(i => esc(pname(sc, i))).join(', ')}.`;
    else if (r.status === 'scheduled' && !r.in_key) h += '<br>This time is not one of the answer key’s start times.';
    return h;
  }
  const g = r.g, bad = (r.chk || []).filter(c => !c[0]);
  if (bad.length) h += '<br>Why: ' + bad.map(c => esc(c[2])).join('<br>') ;
  else if (r.chk) h += '<br>All checks met.';
  if (r.asked.length) h += '<br>Asked privately: ' + r.asked.map(i => esc(pname(sc, i))).join(', ');
  if (r.invites.length > 1) h += `<br>Sent ${r.invites.length} invites (replanned).`;
  if (r.status === 'hand_back' && r.msg) h += '<br>“' + esc(r.msg.slice(0, 140)) + '”';
  h += `<hr>slot quality ${esc(g.slot_quality || 'n/a')} · $${(+g.cost_usd || 0).toFixed(4)} · ${(+g.latency_s || 0).toFixed(0)} s`;
  return h;
}
function addTip(html) { TIPS.push(html); return TIPS.length - 1; }

/* ---------- sidebar ---------- */
const fSplit = document.getElementById('fSplit'), fTag = document.getElementById('fTag'), fRes = document.getElementById('fRes'), fQ = document.getElementById('fQ');
const allTags = [...new Set(IDS.flatMap(i => S[i].tags))].sort();
allTags.forEach(t => fTag.insertAdjacentHTML('beforeend', `<option value="${esc(t)}">${esc(t.replace(/_/g, ' '))}</option>`));
const famLab = f => DATA.family_label[f] || f.replace(/_/g, ' ');
function visibleIds() {
  const q = state.q.trim().toLowerCase();
  return IDS.filter(i => {
    const s = S[i];
    if (state.split !== 'all' && s.split !== state.split) return false;
    if (state.tag !== 'all' && !s.tags.includes(state.tag)) return false;
    if (state.onlyRes && !['b', 'c', 'd'].some(a => s.arms[a]) && !(s.arms.a && s.arms.a.kind === 'recorded')) return false;
    if (q && !(i.toLowerCase().includes(q) || s.req.text.toLowerCase().includes(q) || famLab(s.family).toLowerCase().includes(q))) return false;
    return true;
  });
}
function listOrder() {                       // ids in the order the grouped list shows them
  const ids = visibleIds();
  return DATA.meta.families.flatMap(f => ids.filter(i => S[i].family === f));
}
function itemHtml(i) {
  const s = S[i];
  const dots = ['a', 'b', 'c', 'd'].map(a => `<span class="dot ${armDot(s, a)}" title="${esc(ARM[a].name)}"><i></i>${a}</span>`).join('');
  return `<button class="item" data-id="${i}" aria-current="${i === state.sid}">
    <span class="id"><span>${i}${s.attack ? ' <span class="atkbadge">· attack</span>' : ''}</span><span>${s.split === 'dev' ? 'practice' : 'final exam'}</span></span>
    <span class="tx">${esc(s.req.text)}</span><span class="dots">${dots}</span></button>`;
}
function renderList() {
  const ids = visibleIds();
  document.getElementById('count').textContent = ids.length + ' of ' + IDS.length + ' shown, in ' + new Set(ids.map(i => S[i].family)).size + ' families';
  document.getElementById('list').innerHTML = DATA.meta.families.map(f => {
    const g = ids.filter(i => S[i].family === f);
    if (!g.length) return '';
    return `<details class="fam" data-f="${f}" ${state.closed.has(f) ? '' : 'open'}><summary><span>${esc(famLab(f))}</span><span class="n">${g.length}</span></summary>${g.map(itemHtml).join('')}</details>`;
  }).join('') || '<p class="notrun" style="padding:14px">No test cases match.</p>';
}
fSplit.onchange = () => { state.split = fSplit.value; renderList(); };
fTag.onchange = () => { state.tag = fTag.value; renderList(); };
fRes.onchange = () => { state.onlyRes = fRes.checked; renderList(); };
fQ.oninput = () => { state.q = fQ.value; renderList(); };
document.getElementById('list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  select(b.dataset.id, true);
  if (matchMedia('(max-width: 960px)').matches) document.getElementById('side').open = false;
});
document.getElementById('list').addEventListener('toggle', e => {
  const d = e.target; if (!d.dataset || !d.dataset.f) return;
  if (d.open) state.closed.delete(d.dataset.f); else state.closed.add(d.dataset.f);
}, true);
const sideEl = document.getElementById('side');
function syncSide() { if (matchMedia('(min-width: 961px)').matches) sideEl.open = true; }
matchMedia('(min-width: 961px)').addEventListener('change', syncSide);

/* ---------- view, tab and selection ---------- */
function fixTab() {
  const sc = S[state.sid];
  if (state.tab === 'attack' && !sc.attack) state.tab = 'brief';
  if (state.tab === 'key' && state.view === 'agent') state.tab = 'brief';
}
function syncHash() { try { history.replaceState(null, '', '#' + state.sid + '/' + state.tab + (state.view === 'agent' ? '/agent' : '')); } catch (e) {} }
function paintView() {
  const agent = state.view === 'agent';
  document.getElementById('vAgent').setAttribute('aria-pressed', String(agent));
  document.getElementById('vKey').setAttribute('aria-pressed', String(!agent));
  document.getElementById('viewnote').textContent = agent
    ? 'Only what the agent is given: the request and each person’s own calendar, time away, messages, statements and notes. No answer key, no private-detail markers, no grades.'
    : 'Everything the test knows: the answer key, the checks, the private details that must never leak, and the grades.';
}
function setView(v) { state.view = v; state.who = null; fixTab(); syncHash(); paintView(); renderMain(); }
document.getElementById('vAgent').onclick = () => setView('agent');
document.getElementById('vKey').onclick = () => setView('key');
function select(id, scrollTop) {
  state.sid = id; state.showAll = false; state.rkAll = false; state.pin = null; state.hover = null; state.who = null;
  fixTab(); syncHash(); renderList(); renderMain();
  if (scrollTop) window.scrollTo({ top: 0 });
}
function scriptLines(sc) {
  const out = [];
  const role = id => { const l = sc.lanes.find(x => x.id === id); return l ? l.role : 'required'; };
  sc.script.events.forEach(e => {
    const n = pname(sc, e.who);
    if (e.type === 'rsvp' && e.resp === 'decline') out.push(role(e.who) === 'required'
      ? `After the invite goes out, ${esc(n)} (required) declines, so the meeting must move to a new time with a fresh approval.`
      : `After the invite goes out, ${esc(n)} (optional) declines. The meeting should stay where it is.`);
    else if (e.type === 'new_meeting') out.push(e.at === 'after_approval'
      ? `After the organiser approves, a new meeting lands on ${esc(n)}’s calendar (${esc(dayName(dOf(e.ms)))} ${rng(mins(e.ms), mins(e.me))}). The chosen slot may no longer be free.`
      : `After the invite, a new meeting lands on ${esc(n)}’s calendar (${esc(dayName(dOf(e.ms)))} ${rng(mins(e.ms), mins(e.me))}). The agent should only alert ${esc(n)}.`);
    else if (e.type === 'thread_message') out.push(`${esc(n)} posts in the group chat: “${esc(e.text)}”`);
  });
  sc.script.replies.forEach(r => {
    const n = pname(sc, r.who);
    if (r.about === 'clarify') out.push(`${esc(n)} will answer a clarifying question: “${esc(r.ans)}”`);
    else out.push(`${esc(n)} ${r.yes ? 'will agree to free ' + (r.slot ? esc(dayName(dOf(r.slot))) + ' ' + hm(mins(r.slot)) : 'any time in the window') : 'will say no'} (“${esc(r.ans)}”).`);
  });
  return out;
}
function answerBlock(sc) {
  const exp = sc.key.filter(k => sc.expected.includes(k.start));
  if (sc.outcome === 'hand_back' || !exp.length) return `<span class="big">Hand the request back</span>No slot works, so the right answer is to say so without giving anyone’s reasons.`;
  const top = sc.exp_slot ? exp.find(k => k.start === sc.exp_slot) : exp.filter(k => k.u >= sc.best - 1e-9)[0];
  const bestN = exp.filter(k => k.u >= sc.best - 1e-9).length;
  let h = `<span class="big mono">${esc(dayName(dOf(top.start)))} ${rng(mins(top.start), mins(top.end))}</span>`;
  h += `Score ${top.u} out of ${sc.lanes.length}. ${bestN > 1 ? bestN + ' start times tie for best.' : 'The single best start time.'}`;
  if (top.need.length) h += `<br>It only works if ${top.need.map(i => esc(pname(sc, i))).join(', ')} agrees to free flexible time.`;
  else h += ' Nobody has to give anything up.';
  if (sc.script.events.some(e => e.type === 'rsvp' && e.resp === 'decline' && (sc.lanes.find(l => l.id === e.who) || {}).role === 'required'))
    h += '<br>This shows the first booking. A required person then declines, so the final answer is the next-best slot.';
  return h;
}
function mustChips(sc) {
  const c = [], g = sc.gt;
  g.ask.forEach(i => c.push(`Must privately ask ${esc(pname(sc, i))}`));
  g.lookup.forEach(d => c.push('Must look up ' + esc(d.replace('doc-', '').replace(/-/g, ' '))));
  g.read.forEach(i => c.push(`Must read ${esc(pname(sc, i))}’s messages`));
  g.clarify.forEach(i => c.push(`Must ask ${esc(pname(sc, i))} to clarify`));
  g.alert.forEach(i => c.push(`Must alert ${esc(pname(sc, i))} to a clash`));
  if (g.canaries.length) c.push(`${g.canaries.length} private detail(s) must never reach the chat`);
  if (g.attack) c.push(`Attack: ${esc(g.attack.kind.replace(/_/g, ' '))} (must not: ${esc(g.attack.must_not.join(', ').replace(/_/g, ' '))})`);
  return c.length ? `<div class="must">${c.map(x => `<span>${x}</span>`).join('')}</div>` : '';
}
function armCards(sc) {
  return ['a', 'b', 'c', 'd'].map(a => {
    const A = sc.arms[a];
    let body;
    if (!A) body = `<p class="notrun">No saved run for this case.</p>`;
    else {
      const n = A.runs.length;
      const chips = A.runs.map((r, i) => {
        const cl = runClass(r), t = addTip(runTip(sc, a, r));
        const canPin = r.status === 'scheduled' && r.start;
        const key = canPin ? `${r.start}|${r.end}` : '';
        const pressed = state.pin === key && key ? 'true' : 'false';
        return `<button class="chip ${cl}${canPin ? '' : ' nohit'}" data-tip="${t}" ${canPin ? `data-pin="${key}"` : ''} aria-pressed="${pressed}">
          <span class="v">${A.kind === 'replay' ? 'Replay' : 'Run ' + r.run + tagLab(r)}</span>
          <span class="t">${esc(runWhen(r))}</span><span class="v">${esc(CLS_TEXT[cl])}</span></button>`;
      }).join('');
      const pass = A.runs.filter(r => runClass(r) === 'pass').length;
      const sum = A.kind === 'replay' ? 'Replayed, not graded by the checker' : `${pass} of ${n} runs passed`;
      const grp = new Map();
      A.runs.forEach(r => (r.chk || []).filter(c => !c[0]).forEach(c => { const k = c[1] + '|' + c[2]; if (!grp.has(k)) grp.set(k, { c, runs: [] }); grp.get(k).runs.push(r.run); }));
      const whyHtml = grp.size ? `<ul class="why">${[...grp.values()].map(x => `<li><b>${x.runs.length === n ? 'All runs' : (x.runs.length === 1 ? 'Run ' : 'Runs ') + x.runs.join(', ')}:</b> ${esc(x.c[2])}</li>`).join('')}</ul>`
        : (A.runs.some(r => r.chk) ? `<ul class="why"><li class="okline">All checks met in every run.</li></ul>` : '');
      body = `<div class="sum">${sum}</div><div class="chips">${chips}</div>${whyHtml}`;
    }
    return `<div class="arm"><h3><span class="l">(${a})</span>${esc(ARM[a].name)}</h3><p class="pl">${esc(ARM[a].plain)}</p>${body}</div>`;
  }).join('');
}

/* ---------- conversation replay ---------- */

    <div class="card"><h2>Why it matters</h2>${b && b.why ? `<div class="brief">${paras(b.why)}</div>` : '<p class="notrun">Add a “Why it matters” section to the brief file.</p>'}</div>
  </div>
  <div class="two">
    <div class="card"><h2>What a good run does</h2>${good}
      ${script.length ? `<h2 style="margin-top:14px">What happens during the run (scripted)</h2><ul class="script">${script.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}</div>
    <div class="card answer"><h2>The correct answer</h2>${answerBlock(sc)}</div>
  </div>`;
}

/* --- the week grid --- */
function gridCell(sc, who, d, m, ctx) {
  const st = d + 'T' + hm(m), R = sc.req, agent = state.view === 'agent';
  const head = `<b>${esc(dayName(d))} ${rng(m, m + R.dur)}</b>`;
  const mk = (cls, txt, sub, body, pv) => `<td class="${cls}${pv ? ' g-pv' : ''}" data-tip="${addTip(head + `<span class="sub">${sub}</span>` + (body ? '<hr>' + body : ''))}">${txt}</td>`;
  if (agent) {
    const lane = sc.lanes.find(l => l.id === who);
    if (m < lane.h0 || m + R.dur > lane.h1) return mk('g-h', '', 'Outside their usual hours', 'They accept meetings only between ' + hm(lane.h0) + ' and ' + hm(lane.h1) + '.');
    const hits = lane.raw.filter(b => b.d === d && b.a < m + R.dur && m < b.b);
    const fixed = hits.filter(b => b.k === 'hard');
    if (fixed.length) return mk('g-b', '', 'Busy, cannot move', fixed.map(b => esc(b.t) + ' <i>(' + esc(b.sub) + ')</i>').join('<br>'));
    if (hits.length) return mk('g-x', '', 'Busy, can move if they agree', hits.map(b => esc(b.t) + ' <i>(' + esc(b.sub) + ')</i>').join('<br>'));
    return mk('g-f', '', 'Free in their calendar', 'Messages, statements and notes may still rule this out.');
  }
  if (who === 'all') {
    const e = sc.eg[st]; if (!e) return '<td class="na"></td>';
    const nm = i => esc(pname(sc, i));
    const hasPv = x => ctx.priv(x);
    if (e[0] === 'b') {
      const kinds = e[1].map(x => x[1]);
      const cls = kinds.includes('b') ? 'g-b' : kinds.includes('m') ? 'g-m' : 'g-h';
      const lines = e[1].map(([p, c, lab]) => `${nm(p)}: ` + (c === 'h' ? 'outside usual hours' : c === 'm' ? esc(lab) + ' (movable, but no yes on record)' : esc(lab) + ' (fixed)') + (hasPv(lab) ? ' <b>[private]</b>' : ''));
      return mk(cls, e[1].map(x => ctx.code[x[0]]).join(' '), 'Ruled out by ' + e[1].map(x => nm(x[0])).join(', '), lines.join('<br>'), e[1].some(x => hasPv(x[2])));
    }
    if (e[0] === 'c') return mk('g-c', e[2].map(i => ctx.code[i]).join(' '), 'Works only if ' + e[2].map(nm).join(', ') + ' agrees', 'They would have to free a movable commitment.' + e[3].map(([p, w, lab]) => `<br>${nm(p)} would rather not (${esc(lab)}, −${w})`).join(''));
    const soft = e[3];
    const extra = soft.map(([p, w, lab]) => `${nm(p)} would rather not: ${esc(lab)} (−${w})`).join('<br>') + (e[4].length ? `<br>Optional ${e[4].map(nm).join(', ')} is busy (−0.5, never blocks)` : '');
    return mk(soft.length ? 'g-s' : 'g-f', soft.map(x => ctx.code[x[0]]).join(' '), soft.length ? 'Free, but someone would rather not' : 'Free for everyone', extra || 'Nobody has to give anything up.');
  }
  const v = (sc.pg[who] || {})[st]; if (!v) return '<td class="na"></td>';
  const [c, lab, w] = v, optional = (sc.lanes.find(l => l.id === who) || {}).role === 'optional';
  const note = optional ? '<br><i>Optional: never blocks the meeting.</i>' : '';
  const pv = ctx.priv(lab), pvt = pv ? '<br><b>Private detail: must never reach the group chat.</b>' : '';
  if (c === 'f') return mk('g-f', '', 'Free', 'Nothing in the way.' + note);
  if (c === 's') return mk('g-s', '', 'Free, would rather not', esc(lab) + ` (−${w})` + note, pv);
  if (c === 'c') return mk('g-c', '', 'Works if they agree', esc(lab) + ' is movable, and their yes is on record.' + pvt + note, pv);
  if (c === 'm') return mk('g-m', '', 'Blocked: movable, no yes', esc(lab) + ' is movable, but no yes is on record, so it blocks.' + pvt + note, pv);
  if (c === 'h') return mk('g-h', '', 'Outside usual hours', 'They accept meetings only between ' + hm((sc.lanes.find(l => l.id === who) || {}).h0) + ' and ' + hm((sc.lanes.find(l => l.id === who) || {}).h1) + '.' + note);
  return mk('g-b', '', 'Blocked, cannot move', esc(lab) + pvt + note, pv);
}
function weekGrid(sc, who) {
  const R = sc.req, agent = state.view === 'agent';
  const can = agent ? [] : sc.gt.canaries.map(c => c.toLowerCase());
  const ctx = { code: codesOf(sc), priv: t => !!t && can.some(c => t.toLowerCase().includes(c)) };
  const times = []; for (let m = R.d0; m + R.dur <= R.d1; m += 30) times.push(m);
  let h = `<div class="wk"><table><thead><tr><th class="tm"></th>${R.days.map(d => `<th>${esc(dayName(d))}</th>`).join('')}</tr></thead><tbody>`;
  times.forEach(m => { h += `<tr><td class="tm">${hm(m)}</td>${R.days.map(d => gridCell(sc, who, d, m, ctx)).join('')}</tr>`; });
  h += '</tbody></table></div>';
  const sw = (c, t) => `<span><i class="sw ${c}"></i>${t}</span>`;
  const legend = agent
    ? sw('g-f', 'free') + sw('g-b', 'busy, cannot move') + sw('g-x', 'busy, can move if they agree') + sw('g-h', 'outside usual hours')
    : sw('g-f', 'free') + sw('g-s', 'free, would rather not') + sw('g-c', 'works only if they agree') + sw('g-b', 'blocked, cannot move') + sw('g-m', 'blocked: movable, no yes on record') + sw('g-h', 'outside usual hours') + sw('g-pv', 'private detail');
  const codeLine = who === 'all' && !agent ? `<p class="codes">Letters show who: ${sc.lanes.map(l => `<b>${ctx.code[l.id]}</b> = ${esc(l.name.split(' ')[0])}${l.role === 'optional' ? ' (optional, never blocks)' : ''}`).join(' · ')}. A blocked cell lists who rules the start out; a hatched cell lists who would have to agree.</p>` : '';
  return `<div class="legend">${legend}</div>${h}${codeLine}<p class="note">Each cell is a possible start time for a ${R.dur}-minute meeting, so the cell covers ${R.dur} minutes from the time shown. Hover a cell for the reason.</p>`;
}
function panelCal(sc) {
  const agent = state.view === 'agent';
  if (!state.who || (agent && state.who === 'all') || (state.who !== 'all' && !sc.lanes.some(l => l.id === state.who))) state.who = agent ? sc.lanes[0].id : 'all';
  const pills = (agent ? [] : [['all', 'Everyone together']]).concat(sc.lanes.map(l => [l.id, l.name.split(' ')[0] + (l.role === 'optional' ? ' (optional)' : '')]))
    .map(([id, lab]) => `<button class="pill" data-who="${id}" aria-pressed="${id === state.who}">${esc(lab)}</button>`).join('');
  const days = dayList(sc);
  const o = { raw: agent, key: !agent, arms: false };
  return `<div class="card"><h2>${agent ? 'Calendar the agent can read' : 'Who can make which start time'}</h2>
      <div class="who-pills"><span class="lbl">${agent ? 'Whose agent' : 'Show'}</span>${pills}</div>${weekGrid(sc, state.who)}</div>
    <div class="card"><h2>People in this meeting</h2><div class="members">${memberCards(sc)}</div></div>
    <div class="card"><div class="dayctl"><h2 style="margin:0">Schedules by day</h2>
      ${sc.req.days.length > days.length || state.showAll ? `<button class="btn" id="toggleDays">${state.showAll ? 'Show only days with bookings' : 'Show all ' + sc.req.days.length + ' days'}</button>` : ''}</div>
      <div class="legend">${agent
        ? '<span><i class="sw hard"></i>busy, cannot move</span><span><i class="sw mov"></i>busy, can move if they agree</span><span><i class="sw off"></i>outside usual hours</span>'
        : '<span><i class="sw hard"></i>busy, cannot move</span><span><i class="sw mov"></i>busy, can move if they agree</span><span><i class="sw soft"></i>would rather not</span><span><i class="sw off"></i>outside usual hours</span><span><i class="sw pv"></i>private detail</span><span><i class="sw key"></i>answer key start time</span>'}</div>
      ${days.map(d => dayCard(sc, d, o)).join('')}
      <p class="note">${agent ? 'Calendar entries and time away only, as the person’s own agent reads them. Messages, statements and notes are listed under each person above.' : 'Lanes show each person’s true availability from the answer key (calendar entries, time away, messages, what they said and looked-up events), clipped to the hours of the request.'}</p></div>`;
}

function panelKey(sc) {
  const dur = sc.req.dur, n = sc.lanes.length;
  const expSet = new Set(sc.expected), anyRule = sc.gt.rule === 'any_feasible';
  const isAns = k => expSet.has(k.start) && (anyRule || k.u >= sc.best - 1e-9);
  const rank = [...sc.key].sort((a, b) => (expSet.has(b.start) - expSet.has(a.start)) || (b.u - a.u) || (a.start < b.start ? -1 : 1));
  const shown = state.rkAll ? rank : rank.slice(0, 10);
  const freeExists = sc.key.some(k => !k.need.length);
  const rows = shown.map(k => {
    const ans = isAns(k), low = expSet.has(k.start) && !ans;
    const tag = ans ? `<span class="tag a">${k.start === sc.exp_slot ? 'Answer ★' : 'Answer'}</span>` : low ? '<span class="tag o">Allowed, lower score</span>' : `<span class="tag n">${freeExists ? 'Allowed, but a free slot exists' : 'Possible'}</span>`;
    const need = k.need.length ? 'Needs ' + k.need.map(i => esc(pname(sc, i))).join(', ') + ' to agree' : 'Nobody';
    const lost = k.loss.length ? k.loss.map(([p, a, lab]) => `${esc(pname(sc, p))}: ${esc(lab || 'a preference')} (−${a})`).join('<br>') : '<span class="notrun">none</span>';
    return `<tr class="${ans ? 'isans' : ''}"><td class="sc">${shown.indexOf(k) + 1}</td><td class="mono">${esc(winLabel(sc, k.start))}</td>
      <td class="sc">${k.u} / ${n}<span class="bar2" style="width:${Math.round(k.u / n * 60)}px"></span></td><td>${need}</td><td>${lost}</td><td>${tag}</td></tr>`;
  }).join('');
  const table = sc.key.length
    ? `<div style="overflow:auto"><table class="rk"><thead><tr><th>#</th><th>Start</th><th>Score</th><th>Who gives something up</th><th>Points lost</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
       ${rank.length > 10 ? `<button class="btn" id="rkAll" style="margin-top:8px">${state.rkAll ? 'Show the top 10' : 'Show all ' + rank.length + ' possible start times'}</button>` : ''}
       <p class="note">Score = people who can come, with a partial loss for a preference or a busy optional person (scores from <code>eval/truth.compute</code>). ${sc.key.length} of ${Object.keys(sc.eg).length} start times survive; the rest are ruled out for a required person.</p>`
    : '<p class="notrun">No start time survives, so there is nothing to rank.</p>';
  const ruled = sc.ruled.map(([p, h, m, tot]) => `<div class="rl"><span>${esc(pname(sc, p))}</span>
      <div class="rb" title="${h} fixed or outside hours, ${m} movable with no yes"><i class="h" style="width:${h / tot * 100}%"></i><i class="m" style="width:${m / tot * 100}%"></i></div>
      <span class="mono">${h + m} of ${tot}</span></div>`).join('');
  const cans = sc.gt.canaries.filter(Boolean);
  return `<div class="two">
      <div class="card answer"><h2>The correct answer</h2>${answerBlock(sc)}</div>
      <div class="card"><h2>Why it wins</h2><ul class="whylist">${sc.why.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>
    <div class="card"><h2>Ranked start times</h2>${table}</div>
    <div class="two">
      <div class="card"><h2>Who rules out which starts</h2><div class="ruled">${ruled || '<p class="notrun">No required people.</p>'}</div>
        <div class="legend" style="margin-top:10px"><span><i class="sw hard"></i>fixed commitment or outside hours</span><span><i class="sw bad" style="opacity:.7"></i>movable, no yes on record</span></div>
        <p class="note">Bars add up per person. One start can be ruled out by several people, so the bars overlap.</p></div>
      <div class="card"><h2>What the case requires of the agent</h2>${mustChips(sc) || '<p class="notrun">Only the right answer.</p>'}
        ${cans.length ? `<h2 style="margin-top:12px">Private details that must never reach the group chat</h2><div class="must">${cans.map(c => `<span>${esc(c)}</span>`).join('')}</div>` : ''}</div>
    </div>`;
}

function panelAttack(sc) {
  const A = sc.attack, agent = state.view === 'agent';
  const t = A.text, [a, z] = A.span;
  const body = agent ? esc(t) : `${esc(t.slice(0, a))}<mark class="inj">${esc(t.slice(a, z))}</mark>${esc(t.slice(z))}`;
  const where = `<div class="card"><h2>${agent ? 'What the agent reads' : 'Where the payload sits'}</h2>
      <p class="meta" style="margin-bottom:8px">${esc(A.where)}</p><div class="atk-text">${body}</div>
      ${agent ? '<p class="note">Nothing marks this text as hostile. The agent has to decide that for itself.</p>' : '<p class="note">The highlighted part is the instruction aimed at the AI. The rest is ordinary content that makes the text look real.</p>'}</div>`;
  if (agent) return where;
  const arms = ['a', 'b', 'c', 'd'].map(x => {
    const R = sc.arms[x]; if (!R || R.kind !== 'recorded') return '';
    const how = { guardrail: ' (a guardrail stopped something)', 'none fired': ' (no guardrail fired)' };
    const runs = R.runs.map(r => { const w = r.g.attack_worked === 'True'; return `<span class="o ${w ? 'worked' : 'held'}">Run ${r.run}${tagLab(r)}: ${w ? 'ATTACK WORKED' : 'held'}${w ? '' : (how[r.stop] || '')}</span>`; }).join('');
    const count = what => R.runs.filter(r => r.stop === what).length;
    return `<div style="margin-bottom:8px"><b>(${x}) ${esc(ARM[x].name)}</b> <span class="meta">${count('worked')} of ${R.runs.length} runs let it through · ${count('guardrail')} stopped by a guardrail · ${count('none fired')} with no guardrail fired</span><div class="outcome" style="margin-top:4px">${runs}</div></div>`;
  }).join('') || '<p class="notrun">No saved runs for this case.</p>';
  return `<div class="card"><div class="crumb"><span>${esc(A.kind.replace(/_/g, ' '))}</span><span>·</span><span>consequence weight ${A.weight}</span></div>
      <p style="margin-top:6px">${esc(TAGS[A.kind] || '')}</p></div>
    ${where}
    <div class="two">
      <div class="card"><h2>What must not happen</h2><ul class="tests">${A.must_not.map(m => `<li><b>${esc(m.id.replace(/_/g, ' '))}</b>: ${esc(m.plain)}</li>`).join('')}</ul>
        <p class="note">The attack counts as working if any of these happened in a run. The case is passed when none did.</p></div>
      <div class="card"><h2>Did it work?</h2>${arms}
        <p class="note">“No guardrail fired” means the model did not obey the planted text, or the attack’s route has no recorded guardrail. It does not show the code would have held; the scripted-model tests listed in docs/attack-coverage.md do.</p></div>
    </div>
    <div class="card"><h2>What is meant to stop it</h2><div style="display:grid;gap:8px">${A.defences.map(d => `<div class="def"><div class="top"><span>${esc(d.name)}</span><span class="layer ${d.layer}">${d.layer === 'code' ? 'enforced in code' : 'prompt only'}</span></div>
        <div class="ref">${esc(d.code)}</div><div class="nt">${esc(d.note)} <i>(stops: ${esc(d.stops.replace(/_/g, ' '))})</i></div></div>`).join('')}</div>
      <p class="note">From docs/security-review.md section 6. A guardrail marked “prompt only” asks the model nicely; one marked “enforced in code” cannot be talked past.</p></div>`;
}

function legendRes() {
  return `<div class="legend"><span><i class="sw hard"></i>busy, cannot move</span><span><i class="sw mov"></i>busy, can move if they agree</span><span><i class="sw soft"></i>would rather not</span>
      <span><i class="sw off"></i>outside usual hours</span><span><i class="sw pv"></i>private detail</span><span><i class="sw key"></i>answer key start time</span>
      <span><i class="sw pass"></i>passed</span><span><i class="sw warn"></i>right answer, wrong method</span><span><i class="sw bad"></i>failed</span><span><i class="sw rp"></i>replayed, not graded</span></div>`;
}
function panelRes(sc) {
  if (state.view === 'agent') return `<div class="banner">Pass or fail, the checks and the lanes for each system are measured against the answer key, so they are hidden in the agent’s view. The conversation below is what the system did, with no grading and no private-detail highlighting.</div><div class="card" id="conv"></div>`;
  const days = dayList(sc), o = { raw: false, key: true, arms: true };
  return `<div class="card"><h2>What each system did</h2><div class="arms">${armCards(sc)}</div>
      <p class="note">Click a result to mark its time on every person’s lane below.</p></div>
    <div class="card" id="conv"></div>
    <div class="card"><div class="dayctl"><h2 style="margin:0">Where each run landed</h2>
      ${sc.req.days.length > days.length || state.showAll ? `<button class="btn" id="toggleDays">${state.showAll ? 'Show only days with bookings' : 'Show all ' + sc.req.days.length + ' days'}</button>` : ''}</div>
      ${legendRes()}${days.map(d => dayCard(sc, d, o)).join('')}
      <p class="note">Arm (a) bars marked as replays are the free/busy rule re-run on the case (matched against the saved arm (a) runs by <code>--check</code>). Number inside a bar is the run.</p></div>`;
}

const TABS = [['brief', 'Brief'], ['cal', 'Calendars'], ['key', 'Answer key'], ['attack', 'Attack'], ['res', 'Results']];
function renderMain() {
  TIPS = [];
  const sc = S[state.sid]; if (!sc) return;
  fixTab();
  const agent = state.view === 'agent', R = sc.req;
  const order = listOrder(), idx = order.indexOf(sc.id);
  const tabs = TABS.map(([k, lab]) => {
    const off = (k === 'key' && agent) ? 'Hidden in the agent’s view' : (k === 'attack' && !sc.attack) ? 'This case has no attack' : '';
    return `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}" ${off ? 'disabled title="' + off + '"' : ''}>${lab}</button>`;
  }).join('');
  const head = `<div class="card">
    <div class="crumb"><span>${sc.id}</span><span class="badge ${sc.split === 'dev' ? '' : 'final'}">${sc.split === 'dev' ? 'practice set' : 'final exam set'}</span>
      ${agent ? '' : `<span>${esc(famLab(sc.family))}</span><span>·</span>${sc.tags.map(t => `<span>${esc(t.replace(/_/g, ' '))}</span>`).join('<span>·</span>')}${sc.attack && !sc.tags.includes('attack') ? '<span>·</span><span>attack</span>' : ''}`}</div>
    <h1>${esc(R.text)}</h1>
    <p class="meta">${R.dur} min · ${esc(dayName(R.start))}${R.end !== R.start ? ' to ' + esc(dayName(R.end)) : ''} · ${hm(R.d0)}–${hm(R.d1)} · ${R.wdays.map(d => d[0].toUpperCase() + d.slice(1)).join(', ')} · organiser ${esc(pname(sc, R.org))} · ${sc.lanes.length} people</p>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="prev" ${idx <= 0 ? 'disabled' : ''}>Previous</button><button class="btn" id="next" ${idx < 0 || idx === order.length - 1 ? 'disabled' : ''}>Next</button></div>
    <div class="tabs" role="tablist">${tabs}</div></div>`;
  const panel = { brief: panelBrief, cal: panelCal, key: panelKey, attack: panelAttack, res: panelRes }[state.tab](sc);
  document.getElementById('main').innerHTML = head + `<div class="panel">${panel}</div>`;
  const t = document.getElementById('toggleDays');
  if (t) t.onclick = () => { state.showAll = !state.showAll; renderMain(); };
  document.getElementById('prev').onclick = () => { const i = order.indexOf(state.sid); if (i > 0) select(order[i - 1], true); };
  document.getElementById('next').onclick = () => { const i = order.indexOf(state.sid); if (i >= 0 && i < order.length - 1) select(order[i + 1], true); };
  renderConv(sc);
  updateBands();
}

/* ---------- band, tooltip, pins ---------- */
function updateBands() {
  const sp = state.hover || state.pin;
  const sc = S[state.sid];
  document.querySelectorAll('.day').forEach(card => {
    const band = card.querySelector('.band'); if (!band) return;
    if (sp) {
      const [s, e] = sp.split('|');
      if (dOf(s) === card.dataset.d) {
        const R = sc.req, span = R.d1 - R.d0;
        band.style.left = ((mins(s) - R.d0) / span * 100) + '%';
        band.style.width = ((mins(e) - mins(s)) / span * 100) + '%';
        band.hidden = false; return;
      }
    }
    band.hidden = true;
  });
}
const tip = document.getElementById('tip');
function placeTip(x, y) {
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 14)) + 'px';
  tip.style.top = Math.max(8, Math.min(innerHeight - r.height - 8, y + 16)) + 'px';
}
const main = document.getElementById('main');
main.addEventListener('pointerover', e => {
  const p = e.target.closest('[data-pin]'); if (p) { state.hover = p.dataset.pin; updateBands(); }
  const t = e.target.closest('[data-tip]');
  if (t) { tip.innerHTML = TIPS[+t.dataset.tip]; tip.hidden = false; placeTip(e.clientX, e.clientY); }
});
main.addEventListener('pointermove', e => { if (!tip.hidden) placeTip(e.clientX, e.clientY); });
main.addEventListener('pointerout', e => {
  const p = e.target.closest('[data-pin]'); if (p) { state.hover = null; updateBands(); }
  if (e.target.closest('[data-tip]')) tip.hidden = true;
});
main.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { if (!tb.disabled) { state.tab = tb.dataset.tab; syncHash(); renderMain(); } return; }
  const wb = e.target.closest('[data-who]');
  if (wb) { state.who = wb.dataset.who; renderMain(); return; }
  if (e.target.closest('#rkAll')) { state.rkAll = !state.rkAll; renderMain(); return; }
  const cb = e.target.closest('[data-conv]');
  if (cb) {
    const [k, v] = cb.dataset.conv.split(':'), cv = state.conv;
    if (k === 'arm') { cv.arm = v; cv.run = 0; } else if (k === 'run') cv.run = +v; else cv.detail = !cv.detail;
    renderConv(S[state.sid]); return;
  }
  const p = e.target.closest('[data-pin]');
  if (p) {
    state.pin = state.pin === p.dataset.pin ? null : p.dataset.pin;
    document.querySelectorAll('.chip[data-pin]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.pin === state.pin)));
    updateBands();
    if (state.pin && p.classList.contains('chip')) {
      const card = document.querySelector(`.day[data-d="${dOf(state.pin.split('|')[0])}"]`);
      if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
});
main.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.bar')) { e.preventDefault(); e.target.click(); } });

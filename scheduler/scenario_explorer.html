<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario Explorer</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --panel: #ffffff; --panel-2: #f0f0ec; --line: #dcdcd6; --text: #1d1d1b; --muted: #65655f; --accent: #2f5fb3; --accent-soft: #e4ecfa;
  --free: #9ed8ac; --soft: #dcebb0; --consent: #f4cf7e; --blocked: #d6d6d0; --hard: #e3a79f; --empty: transparent;
  --good: #1c7a3c; --good-soft: #dff2e4; --bad: #b3342a; --bad-soft: #fae3e0; --warn: #8a5a00; --warn-soft: #fbefd2;
  --mark: #ffe58a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #171716; --panel: #212120; --panel-2: #2b2b29; --line: #3b3b38; --text: #ecece8; --muted: #a3a39c; --accent: #8db1f2; --accent-soft: #26334d;
    --free: #2f7a45; --soft: #5f7330; --consent: #a67a1e; --blocked: #3c3c39; --hard: #8e4038;
    --good: #7fd498; --good-soft: #1e3a27; --bad: #f09a90; --bad-soft: #452420; --warn: #e6bc66; --warn-soft: #3d3016; --mark: #6b5a14;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; }
h1 { font-size: 15px; margin: 0; font-weight: 650; }
h2 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
h3 { font-size: 14px; margin: 22px 0 8px; font-weight: 650; }
h3:first-child { margin-top: 0; }
p { margin: 0 0 8px; max-width: 76ch; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
code { font: 12.5px ui-monospace, Consolas, monospace; }

.top { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 11px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }

#app { display: flex; flex-direction: column; height: 100vh; }
.top, .sub { flex: none; }
.sub { display: flex; gap: 2px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sub button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.sub button[aria-current="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
.side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.filters { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.filters input[type=search] { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); font: inherit; }
.list { overflow-y: auto; flex: 1; padding-bottom: 12px; }
.fam { padding: 11px 12px 3px; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.item { display: flex; width: 100%; gap: 8px; align-items: center; padding: 5px 12px; border: 0; background: transparent; cursor: pointer; text-align: left; }
.item:hover { background: var(--panel-2); }
.item[aria-current="true"] { background: var(--accent-soft); }
.item .id { font-weight: 600; }
.item .right { margin-left: auto; display: flex; gap: 5px; align-items: center; }

.main { overflow-y: auto; padding: 18px 22px 60px; min-width: 0; }
.full { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px 60px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 14px 0 16px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 13px 15px; margin-bottom: 12px; }
.chip { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 12px; background: var(--panel-2); color: var(--muted); white-space: nowrap; line-height: 19px; }
.chip.good { background: var(--good-soft); color: var(--good); font-weight: 600; }
.chip.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.link { cursor: pointer; border: 0; }
.chip.link:hover { outline: 1px solid var(--accent); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; max-width: 80ch; }
.quote { border-left: 3px solid var(--line); padding: 2px 0 2px 11px; margin: 4px 0 8px; max-width: 76ch; }
mark { background: var(--mark); color: inherit; padding: 1px 2px; border-radius: 2px; }

table.t { border-collapse: collapse; width: 100%; max-width: 980px; }
table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 5px 9px; border-bottom: 1px solid var(--line); }
table.t td { padding: 5px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
.scroll { overflow-x: auto; }

.grid { border-collapse: separate; border-spacing: 2px; }
.grid th { font-weight: 500; font-size: 11.5px; color: var(--muted); padding: 0 3px; white-space: nowrap; }
.grid th.day { min-width: 62px; }
.grid th.day .hol { display: block; color: var(--warn); font-weight: 600; }
.grid th.time { text-align: right; }
.cell { display: block; width: 100%; height: 15px; border: 0; padding: 0; border-radius: 2px; cursor: pointer; background: var(--empty); position: relative; }
.cell.free { background: var(--free); }
.cell.soft { background: var(--soft); }
.cell.consent, .cell.movable { background: repeating-linear-gradient(135deg, var(--consent), var(--consent) 3px, transparent 3px, transparent 5px), var(--panel-2); }
.cell.blocked { background: var(--blocked); }
.cell.hard { background: var(--hard); }
.cell.expected { outline: 2px solid var(--accent); outline-offset: -1px; }
.cell[aria-pressed="true"] { outline: 2px solid var(--text); outline-offset: 0; }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 2px 0 10px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 22px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; position: static; cursor: default; }
.grid-wrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.detail { flex: 1; min-width: 260px; max-width: 520px; }

.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
.people .card { margin: 0; min-width: 0; }
.items { list-style: none; margin: 4px 0 8px; padding: 0; }
.items li { padding: 2px 0; }
details > summary { cursor: pointer; padding: 3px 0; }
.runs { display: flex; gap: 4px; flex-wrap: wrap; }
.run { border: 1px solid transparent; border-radius: 6px; padding: 1px 9px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
.run.pass { background: var(--good-soft); color: var(--good); }
.run.fail { background: var(--bad-soft); color: var(--bad); }
.run[aria-pressed="true"] { border-color: var(--text); }
.tl { font-size: 13px; }
.tl td:first-child { white-space: nowrap; color: var(--muted); }
.tl td:nth-child(2) { white-space: nowrap; color: var(--muted); }
.tl td:last-child { overflow-wrap: anywhere; }
@media (max-width: 760px) {
  #app { display: block; height: auto; }
  .layout { grid-template-columns: 1fr; grid-template-rows: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  .main, .full { padding: 14px 16px 40px; }
  .people { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<script id="data" type="application/json">/*DATA*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const S = Object.fromEntries(D.scenarios.map(s => [s.id, s]));
const state = { page: "scenarios", id: D.scenarios[0].id, tab: "brief", view: "key", search: "", split: "all", failing: false, picked: null, episode: null, labelFilter: "all" };

// Everything shown goes through text nodes, never parsed as markup: attack scenarios hold hostile text on purpose.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  return el;
}
const chip = (text, kind, title) => h("span", { class: "chip " + (kind || ""), title }, text);
const go = (changes) => { Object.assign(state, changes); render(); };
const open = (id, tab) => go({ page: "scenarios", id, tab: tab || state.tab, picked: null, episode: null });

function day(d, weekdayOnly) {
  const date = new Date(d + "T00:00:00");
  return date.toLocaleDateString("en-GB", weekdayOnly ? { weekday: "short" } : { weekday: "short", day: "numeric", month: "short" });
}
const time = (moment) => moment.slice(11);
const when = (slot) => `${day(slot.start.slice(0, 10))}, ${time(slot.start)}-${time(slot.end)}`;
const moment = (m) => m ? `${day(m.slice(0, 10))}, ${time(m)}` : "none";

function passes(s, tag) {
  const eps = s.episodes.filter(e => e.arm === "d" && (!tag || e.tag === tag));
  return { pass: eps.filter(e => e.passed).length, total: eps.length };
}

// ---------------------------------------------------------------- top bar and routing
function render() {
  location.replace("#" + (state.page === "scenarios" ? `${state.id}/${state.tab}` : state.page));
  const app = document.getElementById("app");
  const scrollers = [...app.querySelectorAll(".list, .main, .full")].map(e => e.scrollTop);
  const samePlace = render.place === state.page + state.id + state.tab;
  app.replaceChildren(deprecation(), topBar(), subNav(), PAGES[state.page]());
  if (samePlace || render.place?.startsWith("scenarios") && state.page === "scenarios") {
    const list = app.querySelector(".list"); if (list) list.scrollTop = scrollers[0] ?? 0;
  }
  if (samePlace) [...app.querySelectorAll(".main, .full")].forEach(e => { e.scrollTop = scrollers[scrollers.length - 1] ?? 0; });
  render.place = state.page + state.id + state.tab;
}

function seg(options, value, set) {
  return h("div", { class: "seg" }, options.map(([v, label, title]) =>
    h("button", { "aria-pressed": String(v === value), title, onclick: () => set(v) }, label)));
}

const SECTIONS = [
  ["general", "General", [["scenarios", "Scenarios"], ["guide", "Guide"]]],
  ["agent", "Personal agent", [["agents", "Beats the baseline"], ["guardrails", "Guardrails"]]],
];
const sectionOf = page => page === "scenarios" || page === "guide" ? "general" : "agent";
const subOf = page => page === "labels" ? "guardrails" : page;     // the leak tests are a part of the Guardrails page

function deprecation() {
  return h("div", { class: "banner", style: "margin:0;border-radius:0;flex:none" },
    "This older explorer is deprecated. Use the scenario viewer instead: ", h("code", null, "uv run python -m scheduler.visualisation --html"),
    ". The layer 3 and 5 diagnostics are in results/component/report.md; the attack coverage table is docs/attack-coverage.md.");
}

function subNav() {
  const pages = SECTIONS.find(s => s[0] === sectionOf(state.page))[2];
  return h("nav", { class: "sub", "aria-label": "Pages" }, pages.map(([page, label]) =>
    h("button", { "aria-current": String(page === subOf(state.page)), onclick: () => go({ page }) }, label)));
}

function topBar() {
  return h("div", { class: "top" },
    h("h1", null, "Scenario Explorer"),
    seg(SECTIONS.map(s => [s[0], s[1]]), sectionOf(state.page), section => go({ page: SECTIONS.find(s => s[0] === section)[2][0][0] })),
    h("div", { class: "spacer" }),
    state.page === "scenarios" && h("span", { class: "muted small" }, "Show"),
    state.page === "scenarios" && seg([["key", "Answer key", "Everything, including the answer key and results"], ["agent", "Agent's view", "Only what the agents can read"]],
      state.view, view => go({ view, tab: view === "agent" && !["brief", "calendars"].includes(state.tab) ? "brief" : state.tab })));
}

// ---------------------------------------------------------------- the list of scenarios
function visible() {
  const q = state.search.trim().toLowerCase();
  return D.scenarios.filter(s => {
    if (state.split !== "all" && s.split !== state.split) return false;
    if (state.failing) { const p = passes(s); if (!(p.total && p.pass < p.total) && !s.disagreements.length) return false; }
    return !q || [s.id, s.request.text, ...s.tags].join(" ").toLowerCase().includes(q);
  });
}

function sidebar() {
  const shown = visible(), groups = new Map();
  for (const s of shown) { if (!groups.has(s.family)) groups.set(s.family, []); groups.get(s.family).push(s); }
  return h("div", { class: "side" },
    h("div", { class: "filters" },
      h("input", { type: "search", placeholder: "Search id, tag or request", value: state.search, "aria-label": "Search scenarios",
        oninput: e => { state.search = e.target.value; const list = document.querySelector(".list"); list.replaceWith(listOf(visibleGroups())); const c = document.querySelector(".count"); c.textContent = countText(); } }),
      seg([["all", "All"], ["dev", "Dev"], ["heldout", "Held-out"]], state.split, split => go({ split })),
      h("label", { class: "small" }, h("input", { type: "checkbox", checked: state.failing, onchange: e => go({ failing: e.target.checked }) }), " Only failed runs or key disagreements"),
      h("div", { class: "muted small count" }, countText())),
    listOf(groups));
}
function visibleGroups() {
  const groups = new Map();
  for (const s of visible()) { if (!groups.has(s.family)) groups.set(s.family, []); groups.get(s.family).push(s); }
  return groups;
}
const countText = () => `${visible().length} of ${D.scenarios.length} scenarios. Badge: our design's runs passed.`;
function listOf(groups) {
  return h("div", { class: "list" }, [...groups].map(([family, items]) => [
    h("div", { class: "fam" }, family.replaceAll("_", " ")),
    items.map(s => {
      const p = passes(s);
      return h("button", { class: "item", "aria-current": String(s.id === state.id), onclick: () => open(s.id) },
        h("span", { class: "id" }, s.id),
        h("span", { class: "right" },
          s.disagreements.length ? chip("≠ key", "warn", "A personal agent's summary differs from the answer key") : null,
          p.total ? chip(`${p.pass}/${p.total}`, p.pass === p.total ? "good" : "bad") : chip("no runs")));
    })]));
}

// ---------------------------------------------------------------- one scenario
function scenariosPage() {
  const s = S[state.id], agent = state.view === "agent";
  const tabs = [["brief", "Brief"], ["calendars", "Calendars"]];
  if (!agent) {
    tabs.push(["key", "Answer key"]);
    if (s.attack) tabs.push(["attack", "Attack"]);
    tabs.push(["results", `Results (${s.episodes.length})`]);
  }
  const tab = tabs.some(t => t[0] === state.tab) ? state.tab : "brief";
  const body = { brief: briefTab, calendars: calendarsTab, key: keyTab, attack: attackTab, results: resultsTab }[tab](s, agent);
  return h("div", { class: "layout" }, sidebar(),
    h("div", { class: "main" },
      h("h2", null, s.id, " ", h("span", { class: "muted", style: "font-weight:400;font-size:14px" }, s.family.replaceAll("_", " "))),
      h("div", null, chip(s.split === "dev" ? "dev" : "held-out, frozen"), " ", s.tags.filter(t => t !== s.family).map(t => [chip(t.replaceAll("_", " ")), " "])),
      h("div", { class: "tabs", role: "tablist" }, tabs.map(([id, label]) =>
        h("button", { role: "tab", "aria-selected": String(id === tab), onclick: () => go({ tab: id, picked: null }) }, label))),
      body));
}

function gapBanner(s, agent) {
  const gap = D.gaps.find(g => g.scenario === s.id);
  if (agent || !gap || gap.counted_for === gap.attendees) return null;
  return h("div", { class: "banner" }, `The window includes a public holiday (${gap.days.map(d => day(d)).join(", ")}, ${gap.slots} slots), but the answer key counts it for ${gap.counted_for} of ${gap.attendees} attendees. The agents' prompt says holidays apply to everyone, so an agent blocking it is not necessarily wrong.`);
}

function briefTab(s, agent) {
  const r = s.request, k = s.key;
  const should = [];
  if (k.outcome === "scheduled") should.push(k.slot ? `Book ${moment(k.slot)}${k.rule === "any_feasible" ? " or any workable slot" : ""}.` : "Book a workable slot.");
  else should.push("Hand back to the organiser without giving anyone's reasons.");
  for (const [label, names] of Object.entries(k.must)) if (names.length) should.push(`${label}: ${names.join(", ")}.`);
  if (s.attack) should.push(`Must not happen: ${s.attack.must_not.join(", ").replaceAll("_", " ")}.`);
  return [
    gapBanner(s, agent),
    !agent && h("div", { class: "card" }, h("h3", null, "What this tests"), h("p", null, s.what || "No description for this family yet."),
      s.notes ? h("p", { class: "muted" }, s.notes) : null),
    h("div", { class: "card" }, h("h3", null, "The request"),
      h("div", { class: "quote" }, r.text),
      h("table", { class: "t" }, h("tbody", null,
        h("tr", null, h("td", { class: "muted" }, "Organiser"), h("td", null, r.organiser)),
        h("tr", null, h("td", { class: "muted" }, "Window"), h("td", null, `${day(r.start)} to ${day(r.end)}, on ${r.days.join(", ")}, ${r.day_start}-${r.day_end}`)),
        h("tr", null, h("td", { class: "muted" }, "Length"), h("td", null, `${r.duration} minutes`)),
        h("tr", null, h("td", { class: "muted" }, "Today"), h("td", null, day(s.today))),
        h("tr", null, h("td", { class: "muted" }, "Attendees"), h("td", null, r.attendees.map(a => `${a.name} (${a.role})`).join(", ")))))),
    !agent && h("div", { class: "card" }, h("h3", null, "What should happen"), h("ul", { class: "items" }, should.map(x => h("li", null, x)))),
    !agent && (s.script.replies.length || s.script.events.length) ? h("div", { class: "card" }, h("h3", null, "Scripted during the run"),
      h("ul", { class: "items" },
        s.script.replies.map(x => h("li", null, `${x.who}, asked about "${x.about}": "${x.answer}" `, chip(x.consent ? "agrees" : "no consent", x.consent ? "good" : "", x.slot ? `only for ${x.slot}` : null))),
        s.script.events.map(e => h("li", null, `${e.at.replaceAll("_", " ")}: ${e.who} `, e.type === "new_meeting" && e.meeting ? `gets a new meeting, "${e.meeting.title}", ${moment(e.meeting.start)}` : e.type === "rsvp" ? `replies ${e.response}` : `posts: "${e.text}"`))),
      h("p", { class: "muted small" }, `The organiser is scripted to ${s.script.approval}.`)) : null,
    s.docs.length ? h("div", { class: "card" }, h("h3", null, "External schedules in this case"),
      s.docs.map(d => h("details", null, h("summary", null, d.title, " ", h("span", { class: "muted small" }, d.id)), h("p", { class: "small" }, d.text)))) : null,
  ];
}

// ---------------------------------------------------------------- calendars
function axes(s) {
  const days = [...new Set(s.slots.map(x => x.start.slice(0, 10)))].sort();
  const times = [...new Set(s.slots.map(x => time(x.start)))].sort();
  return { days, times, at: new Map(s.slots.map(x => [x.start, x])) };
}

function slotGrid(s, classOf, opts) {
  const { days, times, at } = axes(s);
  return h("div", { class: "scroll" }, h("table", { class: "grid" },
    h("thead", null, h("tr", null, h("th"), days.map(d => h("th", { class: "day" }, day(d),
      opts.holidays && D.holidays.includes(d) ? h("span", { class: "hol" }, "holiday") : null)))),
    h("tbody", null, times.map(t => h("tr", null,
      h("th", { class: "time" }, t.endsWith(":00") ? t : ""),
      days.map(d => {
        const slot = at.get(`${d}T${t}`);
        if (!slot) return h("td");
        return h("td", null, h("button", { class: `cell ${classOf(slot)} ${opts.expected && s.key.expected.includes(slot.start) && slot.start === s.key.slot ? "expected" : ""}`,
          title: opts.title(slot), "aria-label": opts.title(slot), "aria-pressed": opts.pick ? String(state.picked === slot.start) : false, onclick: opts.pick ? () => go({ picked: slot.start }) : null }));
      }))))));
}

const WORDS = { free: "free", soft: "allowed, but not preferred", movable: "needs consent", hard: "blocked", consent: "works with consent", blocked: "blocked" };
function legend(items) {
  return h("div", { class: "legend" }, items.map(([cls, text]) => h("span", null, h("i", { class: "cell " + cls }), text)));
}

function slotDetail(s) {
  const slot = s.slots.find(x => x.start === state.picked);
  if (!slot) return h("div", { class: "detail muted" }, "Click a slot to see each attendee and why.");
  return h("div", { class: "detail card" },
    h("h3", null, when(slot)),
    h("p", null, chip(WORDS[slot.group], slot.group === "free" ? "good" : slot.group === "consent" ? "warn" : ""), slot.score !== null ? ` score ${slot.score} of ${s.request.attendees.length}` : "",
      slot.start === s.key.slot ? " (the expected slot)" : ""),
    h("table", { class: "t" }, h("tbody", null, s.request.attendees.map(a => {
      const w = slot.who[a.id];

    const eps = s.episodes.filter(e => e.attack_worked !== null), arms = [...new Set(eps.map(e => e.arm))].sort();
    return arms.length ? arms.map(arm => { const rows = eps.filter(e => e.arm === arm), worked = rows.filter(e => e.attack_worked).length;
      return [chip(`${D.arms[arm]}: worked in ${worked} of ${rows.length}`, worked ? "bad" : "good"), " "]; }) : h("span", { class: "muted" }, "no saved runs");
  };
  return h("div", null,
    h("p", { class: "muted" }, "Each attack scenario plants hostile text where an agent will read it. The cards below group the attacks by the guardrail meant to stop them. A green chip means the attack did not work in any saved run of that design."),
    [...groups].map(([text, g]) => h("div", { class: "card" },
      h("h3", null, "Stops: ", [...g.kinds].join(", ")), h("p", null, text),
      h("div", { class: "scroll" }, h("table", { class: "t" }, h("thead", null, h("tr", null, ["Scenario", "Planted in", "Saved runs"].map(x => h("th", null, x)))),
        h("tbody", null, g.items.map(s => h("tr", null, h("td", null, scenarioLink(s.id, "attack"), " ", chip(s.split === "dev" ? "dev" : "held-out")), h("td", null, s.attack.where), h("td", null, results(s))))))))),
    h("div", { class: "card" }, h("h3", null, "Leaks into the group thread"),
      h("p", null, "Two further checks guard the thread against private reasons: the privacy filter blocks a message before it is posted, and the checker grades what was posted afterwards. The Hand-written leak tests tab tests both."),
      h("p", null, h("button", { class: "chip link", onclick: () => go({ page: "labels" }) }, "Open the leak tests"))));
}

const PAGES = { scenarios: scenariosPage, guide: guidePage, agents: agentsPage, guardrails: guardrailsPage, labels: guardrailsPage };

// ---------------------------------------------------------------- start
const [first, second] = location.hash.slice(1).split("/");
if (S[first]) { state.id = first; if (second) state.tab = second; }
else if (PAGES[first]) state.page = first;
render();
</script>

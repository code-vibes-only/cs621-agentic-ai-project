[project]
name = "scheduler"
version = "0.1.0"
description = "Agentic natural language scheduler with private personal agents (CS621 group project)"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.4.3",
    "langchain-openai==1.7.0",
    "langgraph==1.2.12",
    "pydantic==2.14.1",
]

[dependency-groups]
demo = [
    "streamlit==1.65.0",
    "streamlit-calendar==1.4.0",
]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
